[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.17"

[features]
resolution = true
skip-lint = false

[programs.localnet]
vibestream = "VibeStr3am1111111111111111111111111111111111"

[programs.devnet]
vibestream = "VibeStr3am1111111111111111111111111111111111"

