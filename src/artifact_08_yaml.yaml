version: "3.8"

services:
  univibe-relayer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: univibe-automation-relayer
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"