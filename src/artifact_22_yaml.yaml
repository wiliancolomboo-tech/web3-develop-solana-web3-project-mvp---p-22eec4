version: "3.8"

services:
  vibegrant-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibegrant-enterprise-daemon
    restart: always
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - SOLANA_WS_URL=wss://api.devnet.solana.com/
      - VIBEGRANT_PROGRAM_ID=V1beGrant1111111111111111111111111111111111
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - RESEND_API_KEY=re_test_000000000000000000000000
      - ALERT_EMAIL_RECIPIENT=faculty-board@university.edu
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"