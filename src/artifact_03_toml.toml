[package]
name = "univibe_core"
version = "0.1.0"
description = "UniVibe Autonomous Campus Micro-Grant Escrow on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "univibe_core"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }